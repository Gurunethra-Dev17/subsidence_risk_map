[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subsidence-risk-map"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["jsonschema>=4.23,<5", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]
geo = ["geopandas>=1.0,<2", "shapely>=2,<3", "pyproj>=3.7,<4", "pandas>=2.2,<3", "numpy>=2,<3", "scipy>=1.14,<2", "pyarrow>=18,<20", "duckdb>=1.1,<2", "rasterio>=1.4,<2", "matplotlib>=3.9,<4"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "pydantic>=2.9,<3", "duckdb>=1.1,<2"]

[tool.setuptools.packages.find]
include = ["analytics*", "api*", "contracts*", "engine*", "insar*", "pipeline*"]
exclude = ["*.tests*"]

[tool.pytest.ini_options]
testpaths = ["contracts", "engine", "pipeline", "analytics", "api"]

[tool.ruff]
line-length = 100
target-version = "py311"
