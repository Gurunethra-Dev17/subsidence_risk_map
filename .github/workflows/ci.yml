name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[api,dev,integration]'
      - name: Install DuckDB spatial extension
        run: python -c "import duckdb; connection = duckdb.connect(); connection.execute('INSTALL spatial'); connection.execute('LOAD spatial')"
      - name: Lint backend
        run: python -m ruff check api
      - run: python -m pytest api/tests -q
      - run: make validate-contracts
      - run: make demo
