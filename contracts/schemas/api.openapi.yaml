openapi: 3.1.0
info:
  title: Subsidence Risk Map API
  version: 1.0.0
  description: C4 API contract. JSON responses follow C2/C3; building data requires authority access.
servers:
  - url: /api/v1
paths:
  /meta:
    get:
      responses:
        '200': {description: City metadata and contract versions}
  /wards:
    get:
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [ranked, insufficient_data]}}
        - {name: sort, in: query, schema: {type: string, enum: [rank, score, name]}}
        - {name: order, in: query, schema: {type: string, enum: [asc, desc]}}
        - {name: q, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 50, maximum: 500}}
        - {name: offset, in: query, schema: {type: integer, default: 0}}
      responses:
        '200': {description: Paginated C2 ward summaries}
  /wards/{ward_id}:
    get:
      parameters: [{name: ward_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: One C2 ward}, '404': {description: Unknown ward}}
  /wards/{ward_id}/cells:
    get:
      parameters: [{name: ward_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: C2 cell GeoJSON}}
  /wards/{ward_id}/brief.pdf:
    get:
      parameters: [{name: ward_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: PDF brief, content: {application/pdf: {schema: {type: string, format: binary}}}}}
  /buildings:
    get:
      security: [{AuthorityToken: []}]
      responses: {'200': {description: Authority-only building metrics}, '401': {description: Authority token required}}
  /validation:
    get:
      responses: {'200': {description: C3 validation summary}}
  /health:
    get:
      responses: {'200': {description: Liveness}}
components:
  securitySchemes:
    AuthorityToken: {type: apiKey, in: header, name: X-Authority-Token}
